# Produção: use POSTGRES_PASSWORD no docker/.env (veja docker/.env.example); sem ele, a senha padrão é "moviematch"
name: moviematch
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moviematch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moviematch}
      POSTGRES_DB: moviematch
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'moviematch']
      interval: 2s
      retries: 15

  api:
    build: { context: .., dockerfile: docker/Dockerfile, target: api }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://moviematch:${POSTGRES_PASSWORD:-moviematch}@db:5432/moviematch
      WWW_URL: ${WWW_URL:-http://localhost:3000}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@moviematch.com}
    ports: ['3001:3001']
    depends_on: { db: { condition: service_healthy } }

  www:
    build: { context: .., dockerfile: docker/Dockerfile, target: www }
    restart: unless-stopped
    ports: ['3000:3000']

volumes:
  db:
