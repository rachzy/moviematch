# Desenvolvimento: código montado por bind mount, com hot reload
name: moviematch
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: moviematch
      POSTGRES_PASSWORD: moviematch
      POSTGRES_DB: moviematch
    ports: ['5432:5432']
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'moviematch']
      interval: 2s
      retries: 15

  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025' # Porta SMTP para o Nodemailer conectar
      - '8025:8025' # Painel web para visualizar os e-mails enviados

  api:
    build: { context: .., dockerfile: docker/Dockerfile, target: dev }
    command:
      - sh
      - -c
      - |
        [ -d /app/node_modules/@nestjs/core ] || npm install --no-audit --no-fund &&
        npm exec -w api -- prisma generate --schema=prisma/schema.prisma &&
        npm exec -w api -- prisma db push --schema=prisma/schema.prisma &&
        npm exec -w api -- tsc -p tsconfig.json --ignoreDeprecations 6.0 &&
        (npm exec -w api -- tsc -p tsconfig.json --ignoreDeprecations 6.0 --watch &) &&
        node --watch apps/api/dist/main.js
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://moviematch:moviematch@db:5432/moviematch
      JWT_SECRET: dev-only-secret-troque-em-producao
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports: ['3001:3001']
    volumes: ['../apps:/app/apps']
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_started }

  www:
    build: { context: .., dockerfile: docker/Dockerfile, target: dev }
    command: npm run dev -w www
    environment:
      NODE_ENV: development
    ports: ['3000:3000']
    volumes: ['../apps:/app/apps']

volumes:
  db: